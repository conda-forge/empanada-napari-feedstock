{% set name = "empanada-napari" %}
{% set version = "1.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # hatchling sdist uses an underscore in the filename
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/empanada_napari-{{ version }}.tar.gz
  sha256: 999026a8558b3c7bb8d7bfa3345624e8c0088ff9e7234e92fa46c2e78d61475b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
  run:
    - python >={{ python_min }}
    - albumentations >=1.2
    - cztile >=2.0.0
    - imagecodecs
    - imagehash
    - mlflow
    - napari >=0.10
    - numba >=0.58.1
    - numpy >=1.22
    - py-opencv >=4.11
    - openpyxl
    - pyyaml
    - scikit-image >=0.19
    - simpleitk
    - pytorch >=1.10
    - torchvision >=0.2
    - tqdm
    - zarr >=2.12

test:
  imports:
    - empanada
    - empanada_napari
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/volume-em/empanada-napari
  summary: Napari plugin of algorithms for Panoptic Segmentation of organelles in EM
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - drstone-genius04
    - kedarnarayan
